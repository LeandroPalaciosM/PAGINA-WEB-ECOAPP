<!--Steven Iñiga-->
<app-section-header
  title="Gestión de Categorías"
  subtitle="Administración de categorías del sistema"
  icon="bi bi-tags">
</app-section-header>

    <div class="d-flex justify-content-between align-items-center mb-3">
      <h2 class="fw-bold text-secondary">Listado de Categorías</h2>
        <button class="btn btn-success" (click)="openNew()">
            <i class="bi bi-plus-lg me-1"></i> Nueva Categoría
        </button>
    </div>
<app-generic-table
  [data]="categorias"
  [columns]="columns"
  (viewInfo)="openView($event)"
  (edit)="openEdit($event)"
  (delete)="delete($event)">
</app-generic-table>


<div class="modal fade" tabindex="-1" #categoriaModalRef>
  <div class="modal-dialog">
    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title">
          {{ editingId ? 'Editar Categoría' : 'Nueva Categoría' }}
        </h5>
        <button class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <form [formGroup]="formCategoria">
        <div class="modal-body">
          <input class="form-control mb-2" placeholder="Nombre" formControlName="nombre">
          <textarea class="form-control mb-2" placeholder="Descripción" formControlName="descripcion"></textarea>

          <div class="form-check">
            <input
              class="form-check-input"
              type="checkbox"
              formControlName="estado"
              id="estadoCheck">
            <label class="form-check-label" for="estadoCheck">
              Activo
            </label>
          </div>

        </div>

        <div class="modal-footer">

        <button
          *ngIf="isViewMode"
          class="btn btn-secondary"
          type="button"
          data-bs-dismiss="modal">
          Cerrar
        </button>

        <ng-container *ngIf="!isViewMode">
          <button class="btn btn-secondary" type="button" data-bs-dismiss="modal">
            Cancelar
          </button>
          <button class="btn btn-success" type="button" (click)="save()">
            Guardar
          </button>
        </ng-container>

      </div>
      </form>

    </div>
  </div>
</div>
