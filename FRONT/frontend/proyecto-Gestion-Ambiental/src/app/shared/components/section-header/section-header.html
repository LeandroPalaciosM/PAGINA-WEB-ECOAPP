<div class="p-4 mb-4 bg-success bg-opacity-10 border-start border-5 border-success rounded shadow-sm">
  <div class="d-flex align-items-center">
    <div class="bg-white p-3 rounded-circle text-success me-3 shadow-sm d-flex align-items-center justify-content-center" style="width: 60px; height: 60px;">
      <i class="bi {{ icon }} fs-3"></i>
    </div>
    
    <div>
      <h2 class="fw-bold text-success mb-1">{{ title }}</h2> 
      <p class="text-muted mb-0">{{ subtitle }}</p>
    </div>
  </div>
</div>
