<div class="table-responsive">
  <table class="table table-striped table-bordered table-hover mi-striped">
    <thead class="thead-green">
      <tr>
        <th *ngFor="let col of columns" (click)="ordenarPor(col.key)" style="cursor:pointer">
          {{ col.label }}
          <span *ngIf="sortBy === col.key">
            {{ sortAsc ? '▲' : '▼' }}
          </span>
        </th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let item of paginatedData">
        <td *ngFor="let col of columns">
          {{ item[col.key] }}
        </td>
        <td>
          <button class="btn btn-sm btn-info" (click)="onView(item)"><i class="bi bi-binoculars"></i></button>
          <button class="btn btn-sm btn-primary" (click)="onEdit(item)"><i class="bi bi-pen"></i></button>
          <button class="btn btn-sm btn-danger" (click)="onDelete(item)"><i class="bi bi-trash3"></i></button>
<button *ngIf="showDownload" class="btn btn-outline-danger btn-sm"(click)="onDownload(item)"><i class="bi bi-file-earmark-pdf"></i>
</button>


        </td>
      </tr>
      <tr *ngIf="!data || data.length === 0">
        <td class="table-empty" [attr.colspan]="columns.length + 1">
          No hay registros para mostrar.
        </td>
      </tr>
    </tbody>
  </table>

  <!--Paginación -->
  <nav *ngIf="totalPages() > 1" class="mt-3">
    <ul class="pagination justify-content-center">
      <li class="page-item" [class.disabled]="currentPage === 1">
        <button class="page-link" (click)="cambiarPagina(currentPage - 1)">Anterior</button>
      </li>

      <li class="page-item" *ngFor="let p of [].constructor(totalPages()); let i = index"
          [class.active]="currentPage === i + 1">
        <button class="page-link" (click)="cambiarPagina(i + 1)">{{ i + 1 }}</button>
      </li>

      <li class="page-item" [class.disabled]="currentPage === totalPages()">
        <button class="page-link" (click)="cambiarPagina(currentPage + 1)">Siguiente</button>
      </li>
    </ul>
  </nav>
</div>
